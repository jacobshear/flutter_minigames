name: minigame_tictactoe
description: >-
  Tic-tac-toe for flutter_minigames — the reference game. Logic is a pure
  minigames_core TurnGame; ships a Flutter board widget.
version: 0.1.2
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - turn-based

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Resolves to the local workspace member; switch to a hosted range at publish.
  minigames_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
