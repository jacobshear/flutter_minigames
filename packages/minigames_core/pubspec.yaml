name: minigames_core
description: >-
  Transport-agnostic turn engine and game contract for building async
  turn-based mini-games in Dart. Pure Dart — no Flutter, no Firebase.
version: 0.1.0
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - turn-based
  - multiplayer

environment:
  sdk: ^3.6.0

# Resolves against the workspace root lockfile.
resolution: workspace

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
