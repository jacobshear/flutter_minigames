name: minigame_basketball
description: >-
  Basketball for flutter_minigames — a first-person 3-D shootaround built on
  the minigames_3d harness: three timed rounds at increasing range, solved-band
  flick aiming, swept descending-disc scoring and a depth-sorted court.
version: 0.2.0
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - turn-based
  - physics

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  minigames_3d: ^0.1.0
  minigames_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
