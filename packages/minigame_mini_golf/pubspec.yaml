name: minigame_mini_golf
description: >-
  Mini Golf for flutter_minigames — a perspective-3D putting game on the
  minigames_3d seam, with archetype-driven hole generation and a pure TurnGame
  outcome state.
version: 0.1.0
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - turn-based
  - physics

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  minigames_core: ^0.1.0
  minigames_3d: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
