name: minigame_chess
description: >-
  Chess for flutter_minigames — full-rules TurnGame logic (castling, en
  passant, promotion, checkmate/stalemate/draws) plus an animated Flutter
  board with vector pieces.
version: 0.1.0
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - turn-based

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  minigames_core: ^0.1.0
  # Rules engine: dart port of chess.js (BSD-2-Clause) — legal move gen,
  # check/mate/stalemate, 50-move, threefold repetition, FEN. We wrap it
  # behind the pure TurnGame contract; it never leaks into the public API.
  chess: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
