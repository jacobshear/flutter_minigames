name: example_app
description: >-
  Standalone demo catalog for flutter_minigames. Main menu of every game,
  local hot-seat play via LocalTransport. Multiplayer seam ready for hosts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  minigames_core: ^0.1.0
  minigame_tictactoe: ^0.1.0
  minigame_connect_four: ^0.1.0
  minigame_dots_and_boxes: ^0.1.0
  # Firebase transport — used by the integration test (and future networked mode).
  firebase_core: ^3.13.0
  firebase_database: ^11.3.4
  minigames_firebase: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  minigames_test: ^0.1.0

flutter:
  uses-material-design: true
  assets:
    # Explicit list — directory globs can leave a running build on a stale
    # AssetManifest after hot-restart (new WAVs never get bundled).
    - assets/sfx/mark.wav
    - assets/sfx/drop.wav
    - assets/sfx/drop_long.wav
    - assets/sfx/invalid.wav
    - assets/sfx/win.wav
    - assets/sfx/draw.wav
    - assets/sfx/new_game.wav

