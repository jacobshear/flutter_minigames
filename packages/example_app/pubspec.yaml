name: example_app
description: >-
  Standalone test harness for flutter_minigames. Plays each game hot-seat via
  the in-memory LocalTransport — no backend required.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  minigames_core: ^0.1.0
  minigame_tictactoe: ^0.1.0
  # Firebase transport — used by the integration test (and a future networked mode).
  firebase_core: ^3.13.0
  firebase_database: ^11.3.4
  minigames_firebase: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  minigames_test: ^0.1.0

flutter:
  uses-material-design: true
