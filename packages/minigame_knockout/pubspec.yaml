name: minigame_knockout
description: >-
  Knockout for flutter_minigames — top-down flick-to-knock-off-the-platform
  physics on the minigames_flame seam, with a pure TurnGame outcome state.
version: 0.1.0
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - turn-based
  - physics

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  minigames_core: ^0.1.0
  minigames_ui: ^0.1.0
  minigames_flame: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
