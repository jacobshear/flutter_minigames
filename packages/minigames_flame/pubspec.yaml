name: minigames_flame
description: >-
  Flame + Forge2D physics harness for flutter_minigames physics games
  (shuffleboard, pool, darts…). Provides the simulate-locally,
  serialize-the-outcome seam so board games never pull Flame.
version: 0.1.0
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - physics

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_forge2d: ^0.18.0
  # Imported directly: the harness drives a raw Forge2D World headlessly (no
  # Flame BodyComponent), and the resolved flame_forge2d/forge2d pair has a
  # vector_math clash in body_component.dart we sidestep by not importing it.
  forge2d: ^0.13.0
  minigames_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
