name: minigames_firebase
description: >-
  Firebase Realtime Database transport for flutter_minigames. Implements
  GameTransport so any async turn-based game plays over RTDB — drop it into any
  Firebase app, no changes to the games.
version: 0.1.0
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - firebase
  - multiplayer

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  minigames_core: ^0.1.0
  # Aligned with the versions the host app already ships so it drops in cleanly.
  firebase_core: ^3.13.0
  firebase_database: ^11.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Shared conformance suite — run against the Firebase emulator.
  minigames_test: ^0.1.0

flutter:
