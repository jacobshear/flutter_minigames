name: minigame_shuffleboard
description: >-
  Shuffleboard for flutter_minigames — the first physics game. Pure
  TurnGame outcome-state logic plus a Flame/Forge2D board that simulates
  the slide locally and serializes the settled positions.
version: 0.1.0
repository: https://github.com/jacobshear/flutter_minigames
topics:
  - games
  - turn-based
  - physics

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  minigames_core: ^0.1.0
  minigames_flame: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
