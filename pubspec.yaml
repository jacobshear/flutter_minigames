name: flutter_minigames
publish_to: none
description: >-
  Monorepo for flutter_minigames — a transport-agnostic library of async
  turn-based mini-games for Flutter, plus a standalone test harness.

environment:
  sdk: ^3.6.0

# Dart pub workspaces (Dart 3.6+): one lockfile, one .dart_tool, fast analysis.
# Melos sits on top of this for lifecycle/publishing when we get there.
workspace:
  - packages/minigames_core
  - packages/minigames_test
  - packages/minigame_tictactoe
  - packages/minigame_connect_four
  - packages/minigame_dots_and_boxes
  - packages/minigame_reversi
  - packages/minigame_checkers
  - packages/minigame_mancala
  - packages/minigame_gomoku
  - packages/minigame_chess
  - packages/minigame_sea_battle
  - packages/minigame_filler
  - packages/minigame_crazy_eights
  - packages/minigames_words
  - packages/minigame_anagrams
  - packages/minigame_word_hunt
  - packages/minigame_word_bites
  - packages/minigames_flame
  - packages/minigame_shuffleboard
  - packages/minigames_firebase
  - packages/example_app
