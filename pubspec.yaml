name: flutter_minigames_workspace
publish_to: none
description: >-
  Monorepo for flutter_minigames — a transport-agnostic library of async
  turn-based mini-games for Flutter, plus a standalone test harness.

environment:
  sdk: ^3.6.0

# Dart pub workspaces (Dart 3.6+): one lockfile, one .dart_tool, fast analysis.
# Melos sits on top of this for lifecycle/publishing when we get there.
workspace:
  - packages/flutter_minigames
  - packages/flutter_minigames_firebase
  - packages/minigames_test
  - packages/example_app
